<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none">
  <!-- Studio dark stage card -->
  <rect width="220" height="220" rx="36" fill="#14161a"/>
  <radialGradient id="stageGlow" cx="52%" cy="54%" r="50%">
    <stop offset="0%" stop-color="#d4a359" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#14161a" stop-opacity="0"/>
  </radialGradient>
  <circle cx="114" cy="118" r="96" fill="url(#stageGlow)"/>

  <!-- Stage floor shadow ellipse -->
  <ellipse cx="112" cy="196" rx="76" ry="13" fill="#1d222b" opacity="0.85"/>

  <!-- Upright Bass Body (tilted -11.5 deg like BandstandPopup.tsx drawBassist) -->
  <g transform="translate(132 132) rotate(-11.5)">
    <ellipse cx="0" cy="0" rx="35" ry="57" fill="#402a18" stroke="#d4a359" stroke-width="5.5"/>
  </g>

  <!-- Upright Bass Neck & 3 Strings -->
  <line x1="140" y1="118" x2="180" y2="18" stroke="#8b5a2b" stroke-width="11.5" stroke-linecap="round"/>
  <line x1="136" y1="118" x2="176" y2="18" stroke="#f5d7a6" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="141" y1="118" x2="181" y2="18" stroke="#f5d7a6" stroke-width="1.35" stroke-linecap="round"/>
  <line x1="146" y1="118" x2="186" y2="18" stroke="#f5d7a6" stroke-width="1.35" stroke-linecap="round"/>

  <!-- Soundhole -->
  <circle cx="128" cy="128" r="8.5" fill="#14161a" stroke="#9aa0a8" stroke-width="2.2"/>

  <!-- Strawman Stick Figure Bassist -->
  <!-- Head -->
  <circle cx="82" cy="38" r="19" fill="#e8e8ea" stroke="#9aa0a8" stroke-width="2.4"/>
  <!-- Torso Spine -->
  <line x1="82" y1="76" x2="78" y2="134" stroke="#e8e8ea" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <line x1="64" y1="85" x2="100" y2="85" stroke="#e8e8ea" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Left & Right Legs -->
  <line x1="74" y1="134" x2="56" y2="194" stroke="#e8e8ea" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="89" y1="134" x2="116" y2="197" stroke="#e8e8ea" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Left Arm (Fretting Hand on Neck) -->
  <line x1="98" y1="86" x2="160" y2="66" stroke="#e8e8ea" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="160" cy="66" r="6.2" fill="#e8e8ea" stroke="#9aa0a8" stroke-width="2"/>
  <!-- Right Arm (Plucking Hand over Soundhole) -->
  <line x1="69" y1="86" x2="122" y2="139" stroke="#e8e8ea" stroke-width="5.5" stroke-linecap="round"/>
</svg>
